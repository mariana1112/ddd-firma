# Każdy push na main uruchamia testy, buduje aplikację i publikuje ją na GitHub Pages.
# Nieudane testy zatrzymują publikację, więc telefon nie dostanie zepsutej wersji.
name: Publikacja

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      # Bez prawdziwego adresu serwera aplikacja nie zaloguje nikogo: zatrzymaj publikację z wartościami przykładowymi.
      - name: Sprawdzenie konfiguracji serwera
        run: |
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL nie jest adresem projektu Supabase"; exit 1 ;;
          esac
          case "$VITE_SUPABASE_URL$VITE_SUPABASE_ANON_KEY" in
            *TWOJ-PROJEKT*|*KLUCZ_PUBLISHABLE*|"") echo "Zmienne repozytorium mają wartości przykładowe"; exit 1 ;;
          esac
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          # Zmienne repozytorium (Settings → Variables). Bez nich aplikacja działa tylko lokalnie.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
